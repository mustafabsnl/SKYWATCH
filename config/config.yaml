# ============================================================
# SKYWATCH — Sistem Konfigürasyonu
# Tüm ayarlar bu tek dosyada yönetilir.
# ============================================================

# --- Kamera Ayarları ---
cameras:
  max_active_cameras: 2
  layout:
    rows: 1
    cols: 2
  # Mod ekranı sabit aktif kamera listesi (UI’da seçim yok). Boşsa enabled + max_active kullanılır.
  runtime_fixed_camera_ids:
    - "CAM_01"
    - "CAM_03"
  items:
    - id: "CAM_01"
      name: "Kamera 1"
      source: 0
      enabled: true
      location: "Bina A — Giriş"
      region: "BOLGE_A"
      neighbors: ["CAM_03"]
    - id: "CAM_02"
      name: "Kamera 2"
      source: 1
      enabled: false
      location: "Bina A — Koridor"
      region: "BOLGE_A"
      neighbors: ["CAM_01"]
    - id: "CAM_03"
      name: "Kamera 3"
      source: 2
      enabled: true
      location: "Bina A — Dış Kapı"
      region: "BOLGE_A"
      neighbors: ["CAM_01"]
    - id: "CAM_04"
      name: "Kamera 4"
      source: 3
      enabled: false
      location: "Bina A — Otopark"
      region: "BOLGE_A"
      neighbors: ["CAM_03"]
    - id: "CAM_05"
      name: "Kamera 5"
      source: 4
      enabled: false
    - id: "CAM_06"
      name: "Kamera 6"
      source: 5
      enabled: false
    - id: "CAM_07"
      name: "Kamera 7"
      source: 6
      enabled: false
    - id: "CAM_08"
      name: "Kamera 8"
      source: 7
      enabled: false
    - id: "CAM_09"
      name: "Kamera 9"
      source: 8
      enabled: false
    - id: "CAM_10"
      name: "Kamera 10"
      source: 9
      enabled: false
    - id: "CAM_11"
      name: "Kamera 11"
      source: 10
      enabled: false
    - id: "CAM_12"
      name: "Kamera 12"
      source: 11
      enabled: false

# --- Bölge Tanımları ---
regions:
  BOLGE_A:
    name: "Ana Bina"
  BOLGE_B:
    name: "Dış Alan"
    cameras: ["CAM_03"]

# --- Yüz Tanıma Ayarları ---
face:
  recognition_model: "buffalo_l"
  similarity_threshold: 0.3             # Dusuruldu (0.45 gercek dunya icin cok kati)
  min_face_size: 30                      # 30px altindaki yuzleri yoksay (telefon ekrani vb.)
  scan_interval_ms: 500                  # Tarama araligi (ms)

  # GENERAL mod — tam DB karsilastirma esikleri
  general_match_threshold: 0.55          # Cosine benzerlik esigi (GENERAL mod)
  general_match_margin: 0.05             # En iyi ile ikinci arasi minimum fark
  general_vote_threshold: 2              # Ardilik oy sayisi (GENERAL onay icin)

  # GENEL: cosine_threshold ve match_margin — flat general_match_* ile birlikte kullanılır (fallback)
  general:
    cosine_threshold: 0.55
    match_margin: 0.05
  person_search:
    cosine_threshold: 0.50

  duplicate_check:
    enabled: true
    cosine_threshold: 0.62
    uncertain_low: 0.52
    min_face_confidence: 0.60

# --- DeepSORT Tracking Ayarları ---
tracking:
  max_age: 10                            # Eski track daha hızlı düşsün (predicted yüklemesini azaltır)
  min_hits: 1                            # Tentative trackler hızlı görünür
  iou_threshold: 0.3                     # Kalabalık sahneler için IOU eşiği
  draw_tentative_tracks: true
  render_stale_deepsort_tracks: false
  max_render_time_since_update: 0

  # --- BBox Prediction (kayıp frame için kısa ömürlü tahmin) ---
  bbox_prediction_enabled: true
  prediction_render_enabled: false      # Prediction state tutulur; production overlay'e girmez
  prediction_update_existing_bbox: false  #bu kritik Üretilen tahminin, mevcut track objesinin kutu koordinatlarını doğrudan güncellemesine izin verir.
  max_prediction_gap_sec: 0.20          # 0.20 sn'den uzun süre tahmin yok
  max_prediction_missed_frames: 3        # 2 ardışık miss sonrası tahmin durur
  keep_lost_tracks_for_sec: 0.55         # Lost state kısa süre hafızada kalsın (reacquire için)

  bbox_prediction_max_velocity_px_per_sec: 1200  # Daha kısıtlı hız → çok uzaktaki tahminler iptal
  bbox_prediction_max_shift_px: 160              # Tek tahminde max kayma
  velocity_smoothing_alpha: 0.85                 # Hız EMA: yeni ölçüme biraz daha az ağırlık

  # Predicted track confidence decay (decay altındaysa çizilmez)
  predicted_min_confidence: 0.40
  local_tracker_enabled: true
  local_tracker_method: "klt"
  local_tracker_max_points: 60
  local_tracker_quality: 0.005
  local_tracker_min_distance: 3
  local_tracker_min_points: 4
  local_tracker_max_lost_frames: 3
  local_tracker_max_shift_px: 120
  local_tracker_reinit_on_detection: true
  local_tracker_reinit_min_iou_change: 0.15
  local_tracker_roi_expand_ratio: 0.45
  local_tracker_use_grid_fallback: true
  local_tracker_grid_size: 3
  detection_snap_alpha: 1.0

  # --- Re-acquire (lost → live geri dönüş) ---
  reacquire_iou_threshold: 0.15
  reacquire_center_distance_px: 120
  reacquire_time_window_sec: 0.6
  reacquire_min_score: 0.4

  # --- No-embedding fallback (yüz var ama embedding üretilemedi) ---
  allow_no_embedding_fallback: true
  no_embedding_fallback_mode: "iou"

  # --- ByteTrack — Lost Havuzu (Makale #1) ---
  max_lost_age: 30                       # Kaybolan yüzü kaç frame bekle (1sn @30fps)

  # --- GMC — Global Motion Compensation (Makale #1, #8, #12) ---
  # Sabit kamera için kapalı (false). PTZ veya titrayan kamera için true yap.
  gmc_enabled: false
  gmc_min_movement_px: 1.0              # Bu px'den küçük kamera hareketi gürültü sayılır

  # --- OC-SORT Velocity Consistency (Makale #1, #2) ---
  # Hareket vektörü bu px'den fazla saptıysa eşleşme zayıf sayılır
  velocity_epsilon: 15.0

# --- Kameralar Arası Takip ---
cross_camera:
  enabled: true
  exit_buffer_seconds: 30                # Çıkan kişiyi kaç sn hatırla
  similarity_threshold: 0.45             # Cross-camera eşleşme eşiği

# --- Hareket Analizi ---
movement:
  speed_threshold_fast: 50               # Hızlı hareket (px/frame)
  speed_threshold_running: 100           # Koşma (px/frame)
  dwell_time_threshold: 120              # Şüpheli bekleme süresi (sn)
  direction_change_threshold: 90         # Ani yön değişimi (derece)

# --- Veritabanı ---
database:
  path: "database/skywatch.db"
  photos_dir: "database/photos/"

# --- Aktif Arama ---
search:
  max_concurrent_cameras: 2
  timeout_minutes: 30
  auto_expand_neighbors: true            # Bulunduğunda komşu kameraları tara

# --- Log & Bildirim ---
logging:
  log_dir: "logs/"
  log_file: "logs/events.log"
  save_detection_screenshots: true
  screenshot_dir: "logs/detections/"
  run_logs_dir: "logs/runs/"
  enable_run_logging: true
  perf_log_interval_sec: 1.0
  camera_log_interval_sec: 2.0
  async_logging: true
  keep_last_runs: 30

# --- Bildirim ---
notifications:
  sound_alarm: true
  popup_alert: true

# --- GPU ---
gpu:
  enabled: true
  device: "cuda:0"
  require_cuda: true
  allow_cpu_fallback: false
  log_device_info: true
  insightface_providers:
    - "CUDAExecutionProvider"
    - "CPUExecutionProvider"

# --- Performans ---
performance:
  max_active_cameras: 2
  max_queue_size: 2
  process_every_n_frames: 1
  show_fps: true
  no_signal_placeholder: true
  display_fps: 30
  display_fps_cpu: 12
  display_fps_gpu: 30
  inference_fps_total: 4
  inference_fps_total_cpu: 12
  inference_fps_total_gpu: 8
  max_proc_width_single: 640
  max_proc_width_2cam: 512
  max_proc_width_4cam: 416
  max_proc_width_single_cpu: 512
  max_proc_width_2cam_cpu: 416
  max_proc_width_4cam_cpu: 416
  max_proc_width_single_gpu: 768
  max_proc_width_2cam_gpu: 640
  max_proc_width_4cam_gpu: 512
  detect_every_n_1cam_cpu: 1
  detect_every_n_2cam_cpu: 1
  detect_every_n_4cam_cpu: 2
  detect_every_n_1cam_gpu: 1
  detect_every_n_2cam_gpu: 1
  detect_every_n_4cam_gpu: 1
  db_check_interval_1cam_cpu: 8
  db_check_interval_2cam_cpu: 10
  db_check_interval_4cam_cpu: 15
  db_check_interval_1cam_gpu: 6
  db_check_interval_2cam_gpu: 8
  db_check_interval_4cam_gpu: 10
  decision_ttl_sec: 2.5
  stale_decision_fade_sec: 4.0
  decouple_display_inference: true
  display_source_max_width: 1280
  display_source_max_height: 720
  display_canvas_width: 1280
  display_canvas_height: 720
  display_single_max_width: 1280
  camera_target_fps: 30
  camera_target_fps_cpu: 12
  camera_target_fps_gpu: 30
  video_file_realtime: true
  video_file_loop: true
  drop_old_frames: true

# --- Debug ---
debug:
  draw_raw_yolo_boxes: false             # Production: false → final decision dışında raw YOLO çizilmez
  raw_detection_fallback_enabled: true   # Tracker hiç track üretmediyse fallback olarak raw face kutusu çiz
  draw_tentative_tracks: true
  draw_predicted_tracks: false           # Production: predicted kutuları çizime sokma
  max_predicted_tracks_per_camera: 1     # Aynı kamerada maksimum kaç PREDICTED kutu çizilebilir
  overlay_dedup_enabled: true            # Final decisions çizilmeden önce öncelik tabanlı NMS
  overlay_dedup_iou: 0.45                # Duplicate overlay eşik değeri
  predicted_label_text: "TRACKING"       # Production'da PREDICTED yerine kullanılacak etiket
  
  # Person Search moduna özel teşhis ayarları
  person_search_trace_enabled: true
  person_search_trace_level: "verbose"
  person_search_log_every_n_frames: 10
  person_search_log_all_scores: true
  person_search_log_track_gates: true
  person_search_log_renderer_filter: true
  person_search_jsonl_enabled: true
  person_search_jsonl_file: "person_search_trace.jsonl"
  person_search_text_file: "person_search_trace.log"

overlay:
  draw_all_unique_faces: true
  one_box_per_identity: true
  limit_faces_enabled: false
  max_faces_per_camera: null
  draw_orphan_fallback_only: true
  fallback_min_hits_to_draw: 2
  near_duplicate_enabled: true
  near_duplicate_center_factor: 0.85
  near_duplicate_min_center_px: 35
  near_duplicate_size_ratio_min: 0.50
  near_duplicate_size_ratio_max: 2.00
  near_duplicate_vertical_factor: 0.90
  fallback_suppress_center_factor: 0.90
  fallback_suppress_min_center_px: 40
  fallback_suppress_iou: 0.20
  suppress_raw_if_track_exists: true
  suppress_predicted_if_real_detection_exists: true
  draw_orphan_raw_faces: true
